<div class="container d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-sm p-4 w-100" style="max-width: 420px; border-radius: 12px;">
    <h2 class="text-center text-dark mb-1 fs-4 fw-bold">Clinical Management System</h2>
    <p class="text-center text-secondary mb-4 small">Please login to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label fw-medium text-dark">Username</label>
        <input 
          type="text" 
          id="username" 
          formControlName="username" 
          class="form-control"
          placeholder="Enter your username"
          [class.is-invalid]="f['username'].invalid && (f['username'].dirty || f['username'].touched)"
        >
        <div *ngIf="f['username'].invalid && (f['username'].dirty || f['username'].touched)" class="invalid-feedback">
          Username is required
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-medium text-dark">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-control"
          placeholder="Enter your password"
          [class.is-invalid]="f['password'].invalid && (f['password'].dirty || f['password'].touched)"
        >
        <div *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)" class="invalid-feedback">
          Password is required
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger text-center p-2 mb-4" role="alert">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn btn-primary w-100 py-2 fw-medium">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span *ngIf="isLoading">Logging in...</span>
        <span *ngIf="!isLoading">Login</span>
      </button>
    </form>
  </div>
</div>
