<div class="bg-light min-vh-100" style="font-family: 'Inter', sans-serif !important;">
  
  <!-- 🔹 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 py-3">
    <div class="container-fluid">
      <h2 class="navbar-brand text-danger fs-4 fw-bold m-0">
        Lab Technician Dashboard
      </h2>

      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary fw-medium">Welcome, {{ role }}</span>
        <button class="btn btn-outline-danger btn-sm px-3" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- 🔹 Main Content -->
  <main class="container py-5">

    <div class="row g-4">

      <!-- 🔥 Pending Tests Card -->
      <div class="col-md-6 col-lg-4">
        <div 
          class="card border-0 shadow-sm h-100 cursor-pointer"
          style="transition: 0.3s; cursor: pointer;"
          routerLink="pending"
        >
          <div class="card-body p-4">
            <h3 class="card-title h5 text-dark fw-bold border-bottom pb-3 mb-3">
              Pending Tests
            </h3>

            <p class="text-secondary mb-2">
              Click to view and process pending lab tests.
            </p>

            <!-- <h4 class="text-danger fw-bold">
              {{ pendingCount || 0 }}
            </h4> -->
          </div>
        </div>
      </div>

      <!-- 🔥 Completed Results Card -->
      <div class="col-md-6 col-lg-4">
        <div 
          class="card border-0 shadow-sm h-100 cursor-pointer"
          style="transition: 0.3s; cursor: pointer;"
          routerLink="reports"
        >
          <div class="card-body p-4">
            <h3 class="card-title h5 text-dark fw-bold border-bottom pb-3 mb-3">
              Completed Results
            </h3>

            <p class="text-secondary mb-2">
              Click to view completed lab tests and print the report.
            </p>

            <!-- <h4 class="text-success fw-bold">
              {{ completedCount || 0 }}
            </h4> -->
          </div>
        </div>
      </div>

    </div>

    <!-- 🔥 CHILD ROUTES WILL LOAD HERE -->
    <router-outlet></router-outlet>

  </main>
</div>
