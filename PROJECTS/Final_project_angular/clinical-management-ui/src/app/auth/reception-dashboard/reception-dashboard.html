<div class="bg-light min-vh-100 font-monospace" style="font-family: 'Inter', sans-serif !important;">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 py-3">
    <div class="container-fluid">
      <h2 class="navbar-brand text-dark fs-4 fw-bold m-0">Reception Dashboard</h2>
      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary fw-medium">Welcome, {{ role }}</span>
        <button class="btn btn-outline-danger btn-sm px-3" (click)="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-4">
            <h3 class="card-title h5 text-dark fw-bold border-bottom pb-3 mb-3">Appointments Today</h3>
            <p class="card-text text-secondary">No new appointments.</p>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-4">
            <h3 class="card-title h5 text-dark fw-bold border-bottom pb-3 mb-3">Patient Registration</h3>
            <button class="btn btn-primary w-100 py-2 fw-medium">Register New Patient</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
